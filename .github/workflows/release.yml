name: Build and Release Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set zstandard

      - name: Clean previous build artifacts
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path *.build) { Remove-Item -Recurse -Force *.build -ErrorAction SilentlyContinue }
          if (Test-Path *.dist) { Remove-Item -Recurse -Force *.dist -ErrorAction SilentlyContinue }

      - name: Build EXE with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --include-windows-runtime-dlls=yes `
            --enable-plugin=pyqt6 `
            --windows-icon-from-ico=assets/icon.ico `
            --output-filename=audience-checker.exe `
            --output-dir=dist `
            --include-data-dir=assets=assets `
            --assume-yes-for-downloads `
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: audience-checker-windows-exe
          path: dist/audience-checker.exe
          if-no-files-found: error

      - name: Calculate next version
        id: version
        shell: pwsh
        run: |
          $tags = git tag --list "v2.*.0"
          $maxMinor = 0

          foreach ($tag in $tags) {
            if ($tag -match '^v2\.(\d+)\.0$') {
              $minor = [int]$Matches[1]
              if ($minor -gt $maxMinor) {
                $maxMinor = $minor
              }
            }
          }

          $nextMinor = $maxMinor + 1
          $version = "2.$nextMinor.0"
          $tag = "v$version"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.version }}
          files: dist/audience-checker.exe
          fail_on_unmatched_files: true
          generate_release_notes: true